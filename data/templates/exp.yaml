# § 5 Показательные: замена t = eˣ и её варианты (Демидович, № 2082–2087)
- id: int_exp_rational_01
  topic: indef_integral.subst
  source: "Демидович, № 2082–2084"
  difficulty: B
  var: x
  params:
    k: {choice: [0, 1, 2]}
    n: {choice: [0, 1]}
    p: {int: [-3, 3], exclude: [0]}
    q: {int: [-3, 3], exclude: [0]}
  constraints: ["n == 1 or q == 1"]      # при n = 0 q не участвует
  integrand: "exp(k*x)/((exp(x) + p)*(exp(x) + q)**n)"
  checkpoints:
    - type: choice
      prompt: "Какую замену применишь?"
      options: ["t = eˣ", "по частям", "t = e^(kx) из числителя", "t = ln x"]
      correct: ["t = eˣ"]
      hint: "Всё — функции от eˣ: t = eˣ, dx = dt/t, дальше простые дроби."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены (по t)"
      var: t
      substitution: "exp(x)"
      expected: "t**(k - 1)/((t + p)*(t + q)**n)"
      distractors:
        - "t**k/((t + p)*(t + q)**n)"          # забыл dx = dt/t
        - "t**(k + 1)/((t + p)*(t + q)**n)"    # dx = t dt
        - "t**(k - 1)/((t - p)*(t - q)**n)"    # знаки
      skippable: true
      hint: "x = ln t, dx = dt/t, e^(kx) = tᵏ."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Subs(Integral(t**(k - 1)/((t + p)*(t + q)**n), t), t, exp(x))"
      domain: ["log(Max(1, -p, -q)) + 0.2", "log(Max(1, -p, -q)) + 2.2"]   # правее нулей eˣ + p
  blitz_method: "замена t = eˣ"
  examples:
    - {number: 2082, params: {k: 0, n: 1, p: 1, q: 1}, answer: "x + 1/(1 + exp(x)) - log(1 + exp(x))"}
    - {number: 2083, params: {k: 2, n: 0, p: 1, q: 1}, answer: "exp(x) - log(1 + exp(x))"}
    - {number: 2084, params: {k: 0, n: 1, p: -1, q: 2},       # e²ˣ + eˣ − 2 = (eˣ − 1)(eˣ + 2)
       answer: "-x/2 + log(Abs(exp(x) - 1))/3 + log(exp(x) + 2)/6"}

- id: int_exp_lcm_01
  topic: indef_integral.subst
  source: "Демидович, № 2085"
  difficulty: B
  var: x
  params:
    m: {choice: [1, 2, 3, 6]}
  integrand: "1/(1 + exp(x/m) + exp(2*x/m) + exp(3*x/m))"
  checkpoints:
    - type: choice
      prompt: "Какую замену применишь?"
      options: ["t = e^(x/НОК знаменателей)", "t = eˣ", "по частям", "t = 1 + eˣ"]
      correct: ["t = e^(x/НОК знаменателей)"]
      hint: "Показатели x/m, 2x/m, 3x/m — степени одного t = e^(x/m); 1 + t + t² + t³ = (1 + t)(1 + t²)."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены (по t)"
      var: t
      substitution: "exp(x/m)"
      expected: "m/(t*(1 + t + t**2 + t**3))"
      distractors:
        - "1/(t*(1 + t + t**2 + t**3))"    # потерял m из dx = m dt/t
        - "m/(1 + t + t**2 + t**3)"        # забыл 1/t
        - "m*t/(1 + t + t**2 + t**3)"      # dx = m t dt
      skippable: true
      hint: "x = m·ln t, dx = m dt/t."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Subs(Integral(m/(t*(1 + t + t**2 + t**3)), t), t, exp(x/m))"
  blitz_method: "замена t = eˣ"
  examples:
    - {number: 2085, params: {m: 6}, answer: "x - 3*log((1 + exp(x/6))*sqrt(1 + exp(x/3))) - 3*atan(exp(x/6))"}

- id: int_exp_lcm_02
  topic: indef_integral.subst
  source: "Демидович, № 2086"
  difficulty: B
  var: x
  params:
    m: {choice: [1, 2, 3, 4]}
  integrand: "(1 + exp(2*x/m))/(1 + exp(x/m))**2"
  checkpoints:
    - type: choice
      prompt: "Какую замену применишь?"
      options: ["t = e^(x/НОК знаменателей)", "t = eˣ", "по частям", "t = 1 + eˣ"]
      correct: ["t = e^(x/НОК знаменателей)"]
      hint: "e^(2x/m) = t² при t = e^(x/m): получится рациональная функция."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены (по t)"
      var: t
      substitution: "exp(x/m)"
      expected: "m*(1 + t**2)/(t*(1 + t)**2)"
      distractors:
        - "(1 + t**2)/(t*(1 + t)**2)"      # потерял m
        - "m*(1 + t**2)/(1 + t)**2"        # забыл 1/t
        - "m*(1 + t)/(t*(1 + t)**2)"       # e^(2x/m) = t
      skippable: true
      hint: "x = m·ln t, dx = m dt/t."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Subs(Integral(m*(1 + t**2)/(t*(1 + t)**2), t), t, exp(x/m))"
  blitz_method: "замена t = eˣ"
  examples:
    - {number: 2086, params: {m: 4}, answer: "x + 8/(1 + exp(x/4))"}

- id: int_exp_sqrt_01
  topic: indef_integral.subst
  source: "Демидович, № 2087"
  difficulty: B
  var: x
  params:
    k: {choice: [0, 1, 2]}
    p: {int: [-3, 3], exclude: [0]}
  integrand: "exp(k*x)/sqrt(exp(x) + p)"
  checkpoints:
    - type: choice
      prompt: "Какая замена сразу даёт рациональную функцию?"
      options: ["t = √(eˣ + p)", "t = eˣ", "по частям", "t = e^(x/2)"]
      correct: ["t = √(eˣ + p)"]
      hint: "Корень — целиком в t: eˣ = t² − p, dx = 2t dt/(t² − p)."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены (по t)"
      var: t
      substitution: "sqrt(exp(x) + p)"
      expected: "2*(t**2 - p)**(k - 1)"
      distractors:
        - "(t**2 - p)**(k - 1)"          # потерял 2
        - "2*(t**2 + p)**(k - 1)"        # знак p
        - "2*t*(t**2 - p)**(k - 1)"      # не сократил t
      skippable: true
      hint: "x = ln(t² − p), dx = 2t dt/(t² − p)."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Subs(Integral(2*(t**2 - p)**(k - 1), t), t, sqrt(exp(x) + p))"
      domain: ["log(Max(1, -p)) + 0.2", "log(Max(1, -p)) + 2.2"]
  blitz_method: "замена-корень t = ⁿ√(…)"
  examples:
    - {number: 2087, params: {k: 0, p: -1}, answer: "-2*asin(exp(-x/2))"}
