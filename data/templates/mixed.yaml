# § 6 Разные примеры (Демидович, № 2126–2171): метод темой не подсказан, всё уровня C

- id: mix_rat_xpow_01
  topic: indef_integral.mixed
  source: "Демидович, № 2126"
  difficulty: C
  var: x
  params:
    k: {int: [1, 3]}
  integrand: "1/(x**(2*k)*(1 + x**2))"
  checkpoints:
    - type: choice
      prompt: "Каким методом будешь решать?"
      options: ["разложить на простые дроби", "по частям", "t = 1 + x²", "почленно по таблице"]
      correct: ["разложить на простые дроби"]
      hint: "1/(x²ᵏ(1 + x²)): вычитай по очереди 1/x²ᵏ − 1/(x²ᵏ⁻²(1 + x²)) — получишь знакочередующуюся сумму степеней и ±1/(1 + x²)."
    - type: expr
      prompt: "Разложи на простые дроби"
      expected: "Sum((-1)**(k - i)/x**(2*i), (i, 1, k)).doit() + (-1)**k/(1 + x**2)"
      same_as: integrand
      domain: [0.2, 3.0]
      distractors:
        - "Sum((-1)**(k - i)/x**(2*i), (i, 1, k)).doit() - (-1)**k/(1 + x**2)"   # знак при 1/(1 + x²)
        - "1/x**(2*k) - 1/(1 + x**2)"                                    # потерял средние члены
      hint: "1/(x²(1 + x²)) = 1/x² − 1/(1 + x²); дальше по индукции."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Integral(1/(x**(2*k)*(1 + x**2)), x)"
      domain: [0.2, 3.0]
  blitz_method: "разложение на простые дроби"
  examples:
    - {number: 2126, params: {k: 3}, answer: "-1/(5*x**5) + 1/(3*x**3) - 1/x - atan(x)"}

- id: mix_rat_pow_01
  topic: indef_integral.mixed
  source: "Демидович, № 2127"
  difficulty: C
  var: x
  params:
    j: {choice: [0, 1]}
    n: {choice: [2, 3]}
  integrand: "x**(2*j)/(1 - x**2)**n"
  checkpoints:
    - type: choice
      prompt: "Каким методом будешь решать?"
      options: ["разложить на простые дроби", "t = 1 − x²", "t = x²", "почленно по таблице"]
      correct: ["разложить на простые дроби"]
      hint: "Знаменатель (1 − x)ⁿ(1 + x)ⁿ: простые дроби A/(1 ∓ x)ⁱ (или метод Остроградского)."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Integral(x**(2*j)/(1 - x**2)**n, x)"
      domain: [-0.9, 0.9]
  blitz_method: "разложение на простые дроби"
  examples:
    - {number: 2127, params: {j: 1, n: 3}, answer: "(x + x**3)/(8*(1 - x**2)**2) - log(Abs((1 + x)/(1 - x)))/16"}

- id: mix_rat_quartic_01
  topic: indef_integral.mixed
  source: "Демидович, № 2128"
  difficulty: C
  var: x
  params:
    s: {choice: [1, 2]}
  integrand: "1/(1 + x**(2*s) + x**(4*s))"
  checkpoints:
    - type: choice
      prompt: "Каким методом будешь решать?"
      options: ["разложить знаменатель на множители, затем простые дроби", "t = x²", "по частям", "x = tg t"]
      correct: ["разложить знаменатель на множители, затем простые дроби"]
      hint: "1 + u + u² = (1 + u)² − u: x⁴ + x² + 1 = (x² + x + 1)(x² − x + 1)."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Integral(1/(1 + x**(2*s) + x**(4*s)), x)"
      domain: [0.2, 3.0]
  blitz_method: "разложение на простые дроби"
  examples:
    - {number: 2128, params: {s: 2},
       answer: "log((1 + x*sqrt(3) + x**2)/(1 - x*sqrt(3) + x**2))/(4*sqrt(3)) - atan((1 - x**2)/(x*sqrt(3)))/(2*sqrt(3))"}

- id: mix_irr_frac_01
  topic: indef_integral.mixed
  source: "Демидович, № 2130"
  difficulty: C
  var: x
  params:
    k: {int: [0, 2]}
  integrand: "x**k*sqrt(x/(1 - x))"
  checkpoints:
    - type: choice
      prompt: "Какую замену применишь?"
      options: ["x = sin²t", "t = 1 − x", "по частям", "почленно по таблице"]
      correct: ["x = sin²t"]
      hint: "x = sin²t: 1 − x = cos²t, √(x/(1 − x)) = tg t, dx = 2 sin t cos t dt."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены (по t)"
      var: t
      substitution: "asin(sqrt(x))"
      expected: "2*sin(t)**(2*k + 2)"
      domain: [0.1, 1.4]
      distractors:
        - "sin(t)**(2*k + 2)"                   # потерял 2 из dx
        - "2*sin(t)**(2*k + 1)*cos(t)"          # забыл tg t
        - "2*sin(t)**(2*k)*tan(t)"              # забыл dx
      skippable: true
      hint: "sin²ᵏt · tg t · 2 sin t cos t = 2 sin^(2k+2) t; дальше понижай степень."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Subs(Integral(2*sin(t)**(2*k + 2), t), t, asin(sqrt(x)))"
      domain: [0.05, 0.95]
  blitz_method: "тригонометрическая подстановка"
  method_alternatives: ["замена-корень t = ⁿ√(…)"]
  examples:
    - {number: 2130, params: {k: 2}, answer: "-(15 + 10*x + 8*x**2)*sqrt(x*(1 - x))/24 + 5*asin(sqrt(x))/8"}

- id: mix_irr_split_01
  topic: indef_integral.mixed
  source: "Демидович, № 2131"
  difficulty: C
  var: x
  params:
    p: {int: [1, 3]}
  integrand: "(x + p)/(x**2*sqrt(1 - x**2))"
  checkpoints:
    - type: choice
      prompt: "Каким методом будешь решать?"
      options: ["разделить почленно, затем t = 1/x", "разложение на простые дроби", "по частям", "x = tg t"]
      correct: ["разделить почленно, затем t = 1/x"]
      hint: "(x + p)/x² = 1/x + p/x²; в обоих слагаемых t = 1/x даёт табличные интегралы."
    - type: expr
      prompt: "Раздели почленно"
      expected: "1/(x*sqrt(1 - x**2)) + p/(x**2*sqrt(1 - x**2))"
      same_as: integrand
      domain: [0.1, 0.95]
      distractors:
        - "(1 + p)/(x**2*sqrt(1 - x**2))"                    # x/x² = 1, а не 1/x
        - "1/(x*sqrt(1 - x**2)) + p/sqrt(1 - x**2)"          # потерял x² во втором
        - "1/(x*sqrt(1 - x**2)) + p/(x*sqrt(1 - x**2))"      # p/x² = p/x
      hint: "x/x² = 1/x, p/x² — как есть."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "-p*sqrt(1 - x**2)/x - log((1 + sqrt(1 - x**2))/Abs(x))"
      domain: [0.1, 0.95]
  blitz_method: "замена t = 1/x"
  method_alternatives: ["тригонометрическая подстановка"]
  examples:
    - {number: 2131, params: {p: 2}, answer: "-2*sqrt(1 - x**2)/x - log((1 + sqrt(1 - x**2))/Abs(x))"}

- id: mix_irr_power_01
  topic: indef_integral.mixed
  source: "Демидович, № 2132"
  difficulty: C
  var: x
  params:
    c: {int: [1, 3]}
  integrand: "sqrt(x/(1 - c*x*sqrt(x)))"
  checkpoints:
    - type: choice
      prompt: "Каким методом будешь решать?"
      options: ["внести √x под дифференциал: √x dx = ⅔ d(x√x)", "x = sin²t", "по частям", "разложение на простые дроби"]
      correct: ["внести √x под дифференциал: √x dx = ⅔ d(x√x)"]
      hint: "√(x/(1 − cx√x)) = √x/√(1 − c·x^(3/2)), а √x dx = ⅔ d(x^(3/2))."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "-4*sqrt(1 - c*x*sqrt(x))/(3*c)"
      domain: [0.05, "0.9*c**(-2/3)"]          # 1 − c·x^(3/2) > 0
  blitz_method: "внесение под дифференциал"
  method_alternatives: ["биномиальный дифференциал (Чебышёв)"]
  examples:
    - {number: 2132, params: {c: 1}, answer: "-4*sqrt(1 - x*sqrt(x))/3"}

- id: mix_irr_odd_01
  topic: indef_integral.mixed
  source: "Демидович, № 2133"
  difficulty: C
  var: x
  params:
    k: {choice: [1, 2]}
    a: {choice: [1, 2]}
  integrand: "x**(2*k + 1)/sqrt(1 + a*x**2)"
  checkpoints:
    - type: choice
      prompt: "Какую замену применишь?"
      options: ["t = √(1 + ax²)", "x = sin t", "t = 1/x", "разложение на простые дроби"]
      correct: ["t = √(1 + ax²)"]
      hint: "Нечётная степень x: x dx = t dt/a, x² = (t² − 1)/a — корень уходит."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены (по t)"
      var: t
      substitution: "sqrt(1 + a*x**2)"
      expected: "((t**2 - 1)/a)**k/a"
      domain: [1.1, 3.0]
      distractors:
        - "((t**2 - 1)/a)**k"              # потерял 1/a из x dx = t dt/a
        - "((t**2 + 1)/a)**k/a"            # знак в x² = (t² − 1)/a
        - "t*((t**2 - 1)/a)**k/a"          # не сократил t
      skippable: true
      hint: "t² = 1 + ax², t dt = ax dx."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Subs(Integral(expand(((t**2 - 1)/a)**k/a), t), t, sqrt(1 + a*x**2))"
  blitz_method: "замена-корень t = ⁿ√(…)"
  method_alternatives: ["внесение под дифференциал", "тригонометрическая подстановка", "биномиальный дифференциал (Чебышёв)", "по частям"]
  examples:
    - {number: 2133, params: {k: 2, a: 1}, answer: "(8 - 4*x**2 + 3*x**4)*sqrt(1 + x**2)/15"}

- id: mix_binom_01
  topic: indef_integral.mixed
  source: "Демидович, № 2134"
  difficulty: C
  var: x
  params:
    v: {choice: [1, 2]}
  integrand: "1/(x**v*(1 - x)**(3 - v))**(1/3)"
  checkpoints:
    - type: choice
      prompt: "Какой случай Чебышёва? (запиши как xᵐ(1 − x)ᵖ, n = 1)"
      options: ["p ∈ ℤ", "(m+1)/n ∈ ℤ", "(m+1)/n + p ∈ ℤ", "интеграл не берётся"]
      correct: ["(m+1)/n + p ∈ ℤ"]
      hint: "(m + 1)/n + p = 0: замена z = ∛((1 − x)/x)."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены z = ∛((1 − x)/x) (по z)"
      var: z
      substitution: "((1 - x)/x)**(1/3)"
      expected: "-3*z**(v - 1)/(1 + z**3)"
      domain: [0.2, 3.0]
      distractors:
        - "-z**(v - 1)/(1 + z**3)"              # потерял 3
        - "-3*z**(v + 1)/(1 + z**3)"            # ошибка в степени z
        - "-3*z**(v - 1)/(1 + z**3)**2"         # не сократил (1 + z³)
      skippable: true
      hint: "x = 1/(1 + z³), dx = −3z² dz/(1 + z³)², 1 − x = z³/(1 + z³)."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "Subs(Integral(-3*t**(v - 1)/(1 + t**3), t), t, ((1 - x)/x)**(1/3))"
      domain: [0.05, 0.95]
  blitz_method: "биномиальный дифференциал (Чебышёв)"
  method_alternatives: ["замена-корень t = ⁿ√(…)"]
  examples:
    - {number: 2134, params: {v: 2},
       answer: "log((1 + ((1 - x)/x)**(1/3))**2/(1 - ((1 - x)/x)**(1/3) + ((1 - x)/x)**(2/3)))/2
         - sqrt(3)*atan((2*((1 - x)/x)**(1/3) - 1)/sqrt(3))"}

- id: mix_recip_01
  topic: indef_integral.mixed
  source: "Демидович, № 2135"
  difficulty: C
  var: x
  params:
    n: {int: [1, 3]}
  integrand: "1/(x*sqrt(1 + x**n + x**(2*n)))"
  checkpoints:
    - type: choice
      prompt: "Какую замену применишь?"
      options: ["t = 1/xⁿ", "t = √(1 + xⁿ + x²ⁿ)", "по частям", "x = tg t"]
      correct: ["t = 1/xⁿ"]
      hint: "Вынеси xⁿ из-под корня: √(1 + xⁿ + x²ⁿ) = xⁿ√(t² + t + 1) при t = x⁻ⁿ; dx/x = −dt/(n t)."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены (по t)"
      var: t
      substitution: "x**(-n)"
      expected: "-1/(n*sqrt(t**2 + t + 1))"
      domain: [0.1, 3.0]
      distractors:
        - "-1/sqrt(t**2 + t + 1)"               # потерял n
        - "-1/(n*t*sqrt(t**2 + t + 1))"         # не сократил t
        - "-1/(n*sqrt(t**2 - t + 1))"           # знак среднего члена
      skippable: true
      hint: "x = t^(−1/n), dx/x = −dt/(n t), √(1 + 1/t + 1/t²) = √(t² + t + 1)/t."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "-log(x**(-n) + 1/2 + sqrt(x**(-2*n) + x**(-n) + 1))/n"
      domain: [0.2, 3.0]
  blitz_method: "замена t = 1/x"
  examples:
    - {number: 2135, params: {n: 3}, answer: "-log(Abs((2 + x**3 + 2*sqrt(1 + x**3 + x**6))/x**3))/3"}

- id: mix_recip_02
  topic: indef_integral.mixed
  source: "Демидович, № 2136"
  difficulty: C
  var: x
  params:
    n: {choice: [1, 2]}
  integrand: "1/(x*sqrt(x**(2*n) - 2*x**n - 1))"
  checkpoints:
    - type: choice
      prompt: "Какую замену применишь?"
      options: ["t = 1/xⁿ", "t = √(x²ⁿ − 2xⁿ − 1)", "по частям", "x = 1/cos t"]
      correct: ["t = 1/xⁿ"]
      hint: "√(x²ⁿ − 2xⁿ − 1) = xⁿ√(1 − 2t − t²) при t = x⁻ⁿ; 1 − 2t − t² = 2 − (t + 1)²."
    - type: transformed_integrand
      prompt: "Запиши подынтегральную функцию после замены (по t)"
      var: t
      substitution: "x**(-n)"
      expected: "-1/(n*sqrt(1 - 2*t - t**2))"
      domain: [0.02, 0.4]                      # 0 < t < √2 − 1
      distractors:
        - "-1/sqrt(1 - 2*t - t**2)"             # потерял n
        - "-1/(n*sqrt(1 + 2*t - t**2))"         # знак среднего члена
        - "-1/(n*t*sqrt(1 - 2*t - t**2))"       # не сократил t
      skippable: true
      hint: "dx/x = −dt/(n t), √(1/t² − 2/t − 1) = √(1 − 2t − t²)/t."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "acos((x**n + 1)/(x**n*sqrt(2)))/n"
      domain: ["(1 + sqrt(2))**(1/n) + 0.1", "(1 + sqrt(2))**(1/n) + 3"]   # x²ⁿ − 2xⁿ − 1 > 0
  blitz_method: "замена t = 1/x"
  examples:
    - {number: 2136, params: {n: 2}, answer: "acos((x**2 + 1)/(x**2*sqrt(2)))/2"}

- id: mix_sin_sub_01
  topic: indef_integral.mixed
  source: "Демидович, № 2137"
  difficulty: C
  var: x
  params:
    p: {int: [1, 3]}
  integrand: "(p + sqrt(1 - x**2))/(1 - sqrt(1 - x**2))"
  checkpoints:
    - type: choice
      prompt: "Каким методом будешь решать?"
      options: ["домножить на сопряжённое 1 + √(1 − x²)", "x = sin t", "по частям", "разложение на простые дроби"]
      correct: ["домножить на сопряжённое 1 + √(1 − x²)", "x = sin t"]
      hint: "(1 − √(1 − x²))(1 + √(1 − x²)) = x²: дробь распадается на табличные и ∫√(1 − x²)/x² dx."
    - type: expr
      prompt: "Домножь на сопряжённое и раздели почленно"
      expected: "(p + 1)/x**2 - 1 + (p + 1)*sqrt(1 - x**2)/x**2"
      same_as: integrand
      domain: [0.1, 0.95]
      distractors:
        - "(p + 1)/x**2 + 1 + (p + 1)*sqrt(1 - x**2)/x**2"     # знак при 1: (1 − x²)/x² = 1/x² − 1
        - "(p + 1)/x**2 - 1 + p*sqrt(1 - x**2)/x**2"           # коэффициент при корне: p + 1
        - "p/x**2 - 1 + (p + 1)*sqrt(1 - x**2)/x**2"           # потерял 1 из (1 − x²)/x²
      hint: "(p + s)(1 + s) = p + (p + 1)s + s², s² = 1 − x²."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "-(p + 1)/x - x - (p + 1)*(sqrt(1 - x**2)/x + asin(x))"
      domain: [0.1, 0.95]
  blitz_method: "тригонометрическая подстановка"
  examples:
    - {number: 2137, params: {p: 1}, answer: "-(2 + x**2)/x - 2*sqrt(1 - x**2)/x - 2*asin(x)"}
