  checkpoints:
    - type: expr
      prompt: "Числитель = A·D + B·D′ (D — основание квадрата). Запиши подынтегральную функцию в виде A/D + B·D′/D²"
      expected: "(a*a1 + b*b1)/(a**2 + b**2)/(a*sin(x) + b*cos(x)) + (a*b1 - a1*b)/(a**2 + b**2)*(a*cos(x) - b*sin(x))/(a*sin(x) + b*cos(x))**2"
      same_as: integrand
      domain: ["-atan(b/a) + 0.2", "-atan(b/a) + 2.9"]
      distractors:
        - "(a*b1 - a1*b)/(a**2 + b**2)/(a*sin(x) + b*cos(x)) + (a*a1 + b*b1)/(a**2 + b**2)*(a*cos(x) - b*sin(x))/(a*sin(x) + b*cos(x))**2"   # A и B перепутаны
        - "(a*a1 + b*b1)/(a**2 + b**2)/(a*sin(x) + b*cos(x)) - (a*b1 - a1*b)/(a**2 + b**2)*(a*cos(x) - b*sin(x))/(a*sin(x) + b*cos(x))**2"   # знак B
      hint: "Как в № 2042: Aa − Bb = a₁, Ab + Ba = b₁. Потом ∫D′/D² = −1/D, а ∫dx/D — вспомогательный угол."
