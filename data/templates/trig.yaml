    - {number: 2043.1, params: {a1: 1, b1: 0, a: 1, b: -3}, answer: "x/10 + 3*log(Abs(sin(x) - 3*cos(x)))/10"}
    - {number: 2044, params: {a1: 0, b1: 1, a: 5, b: 3},       # 1/(3 + 5 tg x) = cos x/(5 sin x + 3 cos x)
       answer: "3*x/34 + 5*log(Abs(5*sin(x) + 3*cos(x)))/34"}

