       answer: "-(3*2 - 1*4)/25/(3*sin(x) + 4*cos(x)) + (3*1 + 4*2)/125*log(Abs(tan((x + atan(4/3))/2)))"}

- id: int_trig_lin_ratio_c_01
  topic: indef_integral.trig
  source: "Демидович, № 2046, 2047, 2049"
  difficulty: C
  var: x
  params:
    a1: {int: [-3, 3]}
    b1: {int: [-3, 3]}
    c1: {int: [-3, 3]}
    a: {int: [1, 3]}
    b: {int: [-4, 4], exclude: [0]}
    c: {int: [-3, 3], exclude: [0]}
  constraints:
    - "a1 != 0 or b1 != 0"
    - "c**2 != a**2 + b**2"
    - "c**2 < a**2 + b**2 or c > 0"      # иначе D < 0 всюду — тот же случай, не плодим
    - "c != b"
    - "c1*(a**2 + b**2) - (a1*a + b1*b)*c != 0"
  integrand: "(a1*sin(x) + b1*cos(x) + c1)/(a*sin(x) + b*cos(x) + c)"
  checkpoints:
    - type: expr
      prompt: "Числитель = A·D + B·D′ + C. Запиши подынтегральную функцию в виде A + B·D′/D + C/D"
      expected: "(a1*a + b1*b)/(a**2 + b**2)
        + (a*b1 - a1*b)/(a**2 + b**2)*(a*cos(x) - b*sin(x))/(a*sin(x) + b*cos(x) + c)
        + (c1 - (a1*a + b1*b)/(a**2 + b**2)*c)/(a*sin(x) + b*cos(x) + c)"
      same_as: integrand
      domain: ["asin(Max(-1, -c/sqrt(a**2 + b**2))) - atan(b/a) + 0.15",
               "pi - asin(Max(-1, -c/sqrt(a**2 + b**2))) - atan(b/a) - 0.15"]
      distractors:
        - "(a1*a + b1*b)/(a**2 + b**2)
           + (a*b1 - a1*b)/(a**2 + b**2)*(a*cos(x) - b*sin(x))/(a*sin(x) + b*cos(x) + c)
           + c1/(a*sin(x) + b*cos(x) + c)"                                   # C = c₁ (забыл вычесть A·c)
        - "(a*b1 - a1*b)/(a**2 + b**2)
           + (a1*a + b1*b)/(a**2 + b**2)*(a*cos(x) - b*sin(x))/(a*sin(x) + b*cos(x) + c)
           + (c1 - (a*b1 - a1*b)/(a**2 + b**2)*c)/(a*sin(x) + b*cos(x) + c)"  # A и B перепутаны
        - "(a1*a + b1*b)/(a**2 + b**2)
           - (a*b1 - a1*b)/(a**2 + b**2)*(a*cos(x) - b*sin(x))/(a*sin(x) + b*cos(x) + c)
           + (c1 - (a1*a + b1*b)/(a**2 + b**2)*c)/(a*sin(x) + b*cos(x) + c)"  # знак B
      hint: "Сравни коэффициенты: при sin — Aa − Bb = a₁, при cos — Ab + Ba = b₁, свободный — Ac + C = c₁."
    - type: antiderivative
      prompt: "Ответ (с +C)"
      reference: "(a1*a + b1*b)/(a**2 + b**2)*x
        + (a*b1 - a1*b)/(a**2 + b**2)*log(Abs(a*sin(x) + b*cos(x) + c))
        + (c1 - (a1*a + b1*b)/(a**2 + b**2)*c)*Subs(Integral(2/((c - b)*t**2 + 2*a*t + c + b), t), t, tan(x/2))"
      domain: ["asin(Max(-1, -c/sqrt(a**2 + b**2))) - atan(b/a) + 0.15",
               "pi - asin(Max(-1, -c/sqrt(a**2 + b**2))) - atan(b/a) - 0.15"]   # между нулями D
  blitz_method: "числитель = A·знам + B·знам′"
  examples:
    - {number: 2047, params: {a1: 1, b1: 2, c1: -3, a: 1, b: -2, c: 3},
       answer: "-3*x/5 + 4*log(Abs(sin(x) - 2*cos(x) + 3))/5 - 6*atan((5*tan(x/2) + 1)/2)/5"}
    - {number: 2049, params: {a1: 2, b1: 1, c1: 0, a: 3, b: 4, c: -2},
       answer: "2*x/5 - log(Abs(3*sin(x) + 4*cos(x) - 2))/5
         + 4/(5*sqrt(21))*log(Abs((sqrt(7) + sqrt(3)*(2*tan(x/2) - 1))/(sqrt(7) - sqrt(3)*(2*tan(x/2) - 1))))"}
